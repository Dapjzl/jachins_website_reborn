<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Employee Directory | JACHINS Intranet</title>
    <link rel="shortcut icon" type="image/png" href="images/jachins_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="../css/custom.css" rel="stylesheet">
    <link href="intranet.css" rel="stylesheet">
</head>

<body class="sisf-comman-bg-light" data-protected="true" data-page="employees">

    <div id="header-placeholder"></div>

    <div class="sis-intranet-body sis-comman-background">

        <div id="sidebar-placeholder"></div>

        <main class="sis-intranet-main">

            <div class="sisf-sis-section-title sis-section-title mb-4">
                <span class="sisf-m-subtitle white sis-m-subtitle-dark">Internal</span>
                <h2 class="sisf-m-title" style="font-size: 28px;">Employee <span class="sisf-e-colored">Directory</span></h2>
                <p class="mb-0">Find colleagues by name, department, or position. Contact details shown are work contact only.</p>
            </div>

            <div class="sis-filter-bar sisf-sis-comman-drop-bg sis-radius mb-3 p-3">
                <div class="row g-2 align-items-center">
                    <div class="col-md-6">
                        <input type="text" id="empSearch" class="form-control" placeholder="Search by name or position...">
                    </div>
                    <div class="col-md-4">
                        <select id="empDeptFilter" class="form-select">
                            <option value="all">All Departments</option>
                        </select>
                    </div>
                    <div class="col-md-2 text-md-end">
                        <span class="text-white" style="font-size:13px;"><span id="empCount">10</span> employees</span>
                    </div>
                </div>
            </div>

            <div class="sisf-sis-comman-drop-bg sis-radius p-3" style="overflow-x:auto;">
                <table class="sis-data-table w-100">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>ID</th>
                            <th>DEPARTMENT</th>
                            <th>POSITION</th>
                            <th>EMAIL</th>
                            <th>EXT.</th>
                        </tr>
                    </thead>
                    <tbody id="empTableBody">
                        <!-- Loaded dynamically via JS -->
                    </tbody>
                </table>
                <p id="empNoResults" class="text-center mt-3 mb-0 d-none" style="color: rgba(255,255,255,0.6);">No employees match your search.</p>
            </div>

        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="intranet.js"></script>
    <script>
        var employeeList = [
            { employee_id: "JD-0231", full_name: "Chidinma Okafor", department: "Engineering", job_title: "Engineering Design Lead", email: "c.okafor@jachinsgroup.com", phone: "102" },
            { employee_id: "IT-0105", full_name: "Tunde Balogun", department: "IT", job_title: "IT Systems Administrator", email: "t.balogun@jachinsgroup.com", phone: "110" },
            { employee_id: "HR-0044", full_name: "Ngozi Eze", department: "Human Resources", job_title: "HR Business Partner", email: "n.eze@jachinsgroup.com", phone: "121" },
            { employee_id: "HR-0058", full_name: "Ifeoma Nwachukwu", department: "Human Resources", job_title: "Training & Development Officer", email: "i.nwachukwu@jachinsgroup.com", phone: "123" },
            { employee_id: "FN-0071", full_name: "Emeka Obi", department: "Finance", job_title: "Financial Accountant", email: "e.obi@jachinsgroup.com", phone: "130" },
            { employee_id: "FN-0082", full_name: "Blessing Udo", department: "Finance", job_title: "Payroll & Compensation Analyst", email: "b.udo@jachinsgroup.com", phone: "131" },
            { employee_id: "MK-0019", full_name: "Chuka Nnamdi", department: "Marketing", job_title: "Business Development Executive", email: "c.nnamdi@jachinsgroup.com", phone: "140" },
            { employee_id: "OP-0206", full_name: "Aisha Mohammed", department: "Operations", job_title: "Site Operations Supervisor", email: "a.mohammed@jachinsgroup.com", phone: "150" },
            { employee_id: "OP-0219", full_name: "Kelechi Anyanwu", department: "Operations", job_title: "QA/QC Inspector", email: "k.anyanwu@jachinsgroup.com", phone: "151" },
            { employee_id: "AD-0003", full_name: "Grace Adeyemi", department: "Administration", job_title: "Executive Assistant", email: "g.adeyemi@jachinsgroup.com", phone: "101" }
        ];

        function initials(name) {
            var parts = (name || "").trim().split(/\s+/);
            if (!parts[0]) return "--";
            return ((parts[0][0] || "") + (parts[parts.length - 1]?.[0] || "")).toUpperCase();
        }

        function escapeHtml(str) {
            var div = document.createElement("div");
            div.textContent = str == null ? "" : str;
            return div.innerHTML;
        }

        function renderEmployees(list) {
            var tbody = document.getElementById("empTableBody");
            var countEl = document.getElementById("empCount");
            var noResults = document.getElementById("empNoResults");

            if (!tbody) return;

            if (!list || !list.length) {
                tbody.innerHTML = "";
                if (noResults) noResults.classList.remove("d-none");
                if (countEl) countEl.textContent = "0";
                return;
            }

            if (noResults) noResults.classList.add("d-none");
            if (countEl) countEl.textContent = list.length;

            tbody.innerHTML = list.map(function (e) {
                return '<tr class="emp-row">' +
                    '<td class="d-flex align-items-center gap-2"><span class="sis-avatar-sm">' + initials(e.full_name) + '</span> ' + escapeHtml(e.full_name) + '</td>' +
                    '<td>' + escapeHtml(e.employee_id) + '</td>' +
                    '<td>' + escapeHtml(e.department || '') + '</td>' +
                    '<td>' + escapeHtml(e.job_title || '') + '</td>' +
                    '<td><a href="mailto:' + escapeHtml(e.email) + '" class="sisf-e-main-color">' + escapeHtml(e.email) + '</a></td>' +
                    '<td>' + escapeHtml(e.phone || '—') + '</td>' +
                    '</tr>';
            }).join("");
        }

        function setupFilters() {
            var searchInput = document.getElementById("empSearch");
            var deptFilter = document.getElementById("empDeptFilter");

            if (deptFilter) {
                deptFilter.innerHTML = '<option value="all">All Departments</option>';
                var departments = Array.from(new Set(employeeList.map(function (e) { return e.department; }).filter(Boolean))).sort();
                departments.forEach(function (d) {
                    var opt = document.createElement("option");
                    opt.value = d;
                    opt.textContent = d;
                    deptFilter.appendChild(opt);
                });
            }

            function applyFilters() {
                var q = (searchInput ? searchInput.value : "").trim().toLowerCase();
                var dept = deptFilter ? deptFilter.value : "all";
                var filtered = employeeList.filter(function (e) {
                    var matchesQuery = (e.full_name || "").toLowerCase().includes(q) ||
                                       (e.job_title || "").toLowerCase().includes(q) ||
                                       (e.employee_id || "").toString().toLowerCase().includes(q);
                    var matchesDept = dept === "all" || dept === e.department;
                    return matchesQuery && matchesDept;
                });
                renderEmployees(filtered);
            }

            if (searchInput) searchInput.addEventListener("input", applyFilters);
            if (deptFilter) deptFilter.addEventListener("change", applyFilters);
        }

        async function loadData() {
            // Check if Supabase client is available and fetch live data
            if (window.supabaseClient) {
                try {
                    var res = await window.supabaseClient
                        .from("employees")
                        .select("employee_id, full_name, department, job_title, email, phone")
                        .order("full_name", { ascending: true });

                    if (res.data && res.data.length > 0) {
                        employeeList = res.data;
                    }
                } catch (e) {
                    console.log("Using static employee list fallback.");
                }
            }

            renderEmployees(employeeList);
            setupFilters();
        }

        // Render immediately, and re-render if auth/intranet ready triggers
        document.addEventListener("DOMContentLoaded", function () {
            renderEmployees(employeeList);
            setupFilters();
            loadData();
        });

        window.onIntranetReady = function () {
            loadData();
        };
    </script>
</body>

</html>
