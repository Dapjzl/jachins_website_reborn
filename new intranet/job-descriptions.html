        /* Accordion High-Specificity Overrides */
        html body .custom-accordion.accordion,
        html body .custom-accordion .accordion-item {
            --bs-accordion-bg: #ffffff !important;
            --bs-accordion-color: #212529 !important;
            --bs-accordion-btn-bg: #ffffff !important;
            --bs-accordion-btn-color: #212529 !important;
            --bs-accordion-active-bg: #ffffff !important;
            --bs-accordion-active-color: #212529 !important;
            background-color: #ffffff !important;
        }

        html body .custom-accordion .accordion-button,
        html body .custom-accordion .accordion-button:not(.collapsed),
        html body .custom-accordion .accordion-button:focus {
            background-color: #ffffff !important;
            color: #212529 !important;
            box-shadow: none !important;
        }

        html body .custom-accordion .accordion-button .text-dark,
        html body .custom-accordion .accordion-button:not(.collapsed) .text-dark {
            color: #212529 !important;
            opacity: 1 !important;
        }

        /* Department Badges */
        .jd-dept-badge {
            font-size: 12px !important;
            padding: 6px 14px !important;
            letter-spacing: 0.8px;
            font-weight: 700;
            min-width: 65px;
            text-align: center;
            border-radius: 4px;
        }

        /* Dropdown Panel Container & Dividers */
        .jd-dropdown-box {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 8px;
        }

        .jd-column-divider {
            border-right: 1px solid #e2e8f0 !important;
        }

        .jd-inner-section {
            border-bottom: 1px solid #e2e8f0 !important;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 767.98px) {
            .jd-column-divider {
                border-right: none !important;
                border-bottom: 1px solid #e2e8f0 !important;
                padding-bottom: 1rem;
                margin-bottom: 1rem;
            }
        }

        /* Structured Bullet Lists */
        .jd-list-styled {
            list-style: none;
            padding-left: 0;
            margin-bottom: 0;
        }

        .jd-list-styled li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.5;
            color: #334155;
        }

        .jd-list-styled li i {
            position: absolute;
            left: 0;
            top: 3px;
            color: #c70205;
            font-size: 12px;
        }

        /* Skill Pill Badges */
        .jd-skill-badge {
            display: inline-block;
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        /* Header Metainfo Tags */
        .jd-meta-tag {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            background: #f8fafc;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

        function escapeHtml(str) {
            var div = document.createElement("div");
            div.textContent = str == null ? "" : str;
            return div.innerHTML;
        }

        function formatList(items) {
            if (!items) return '<p class="text-muted mb-0">N/A</p>';
            if (Array.isArray(items)) {
                return '<ul class="jd-list-styled">' +
                    items.map(function (i) {
                        return '<li><i class="fa-solid fa-circle-check"></i> ' + escapeHtml(i) + '</li>';
                    }).join('') +
                    '</ul>';
            }
            return '<p class="mb-0 text-dark" style="font-size:13px;">' + escapeHtml(items) + '</p>';
        }

        function formatSkills(skills) {
            if (!skills) return '<span class="text-muted">N/A</span>';
            var skillArray = Array.isArray(skills) ? skills : String(skills).split(',');
            return skillArray.map(function (s) {
                return '<span class="jd-skill-badge"><i class="fa-solid fa-check text-danger me-1"></i> ' + escapeHtml(s.trim()) + '</span>';
            }).join('');
        }

        function renderJdList(list) {
            var container = document.getElementById("jdAccordion");
            var countEl = document.getElementById("jdCount");
            var noResults = document.getElementById("jdNoResults");

            if (!container) return;

            if (!list || !list.length) {
                container.innerHTML = "";
                if (noResults) noResults.classList.remove("d-none");
                if (countEl) countEl.textContent = "0";
                return;
            }

            if (noResults) noResults.classList.add("d-none");
            if (countEl) countEl.textContent = list.length;

            container.innerHTML = list.map(function (item, idx) {
                var collapseId = "jdCollapse_" + idx;
                return '<div class="accordion-item jd-item mb-2 border rounded overflow-hidden bg-white shadow-sm" data-dept="' + escapeHtml(item.department) + '" data-title="' + escapeHtml(item.title) + '">' +
                    '<h2 class="accordion-header m-0">' +
                    '<button class="accordion-button collapsed py-3" type="button" data-bs-toggle="collapse" data-bs-target="#' + collapseId + '">' +
                    '<div class="d-flex align-items-center flex-grow-1 text-start me-2">' +
                    '<span class="badge bg-danger text-white me-3 jd-dept-badge shadow-sm">' + escapeHtml(item.badge || item.department) + '</span>' +
                    '<div>' +
                    '<span class="text-dark fw-bold d-block" style="font-size:16px;">' + escapeHtml(item.title) + '</span>' +
                    '<small class="text-muted"><i class="fa-solid fa-building me-1"></i> ' + escapeHtml(item.department) + '</small>' +
                    '</div>' +
                    '</div>' +
                    '</button>' +
                    '</h2>' +
                    '<div id="' + collapseId + '" class="accordion-collapse collapse" data-bs-parent="#jdAccordion">' +
                    '<div class="accordion-body p-4 border-top" style="background-color: #f8fafc;">' +
                    '<div class="jd-dropdown-box p-4 shadow-sm">' +
                    
                    /* Metadata Tag Row */
                    '<div class="d-flex flex-wrap gap-2 mb-3 pb-3 border-bottom">' +
                    '<span class="jd-meta-tag"><i class="fa-solid fa-user-shield text-danger"></i> Reports To: ' + escapeHtml(item.reports_to || "N/A") + '</span>' +
                    '<span class="jd-meta-tag"><i class="fa-solid fa-briefcase text-danger"></i> Type: ' + escapeHtml(item.employment_type || "Full-time") + '</span>' +
                    '<span class="jd-meta-tag"><i class="fa-solid fa-sitemap text-danger"></i> Department: ' + escapeHtml(item.department) + '</span>' +
                    '</div>' +

                    /* Two Column Content */
                    '<div class="row g-4">' +
                    '<div class="col-md-6 jd-column-divider">' +
                    '<div class="jd-inner-section">' +
                    '<strong class="text-dark d-block mb-2" style="font-size:14px;"><i class="fa-solid fa-list-check text-danger me-2"></i> Key Responsibilities</strong>' +
                    formatList(item.responsibilities) +
                    '</div>' +
                    '<div class="mb-0">' +
                    '<strong class="text-dark d-block mb-2" style="font-size:14px;"><i class="fa-solid fa-chart-line text-danger me-2"></i> KPIs & Performance Benchmarks</strong>' +
                    formatList(item.kpis) +
                    '</div>' +
                    '</div>' +

                    '<div class="col-md-6">' +
                    '<div class="jd-inner-section">' +
                    '<strong class="text-dark d-block mb-2" style="font-size:14px;"><i class="fa-solid fa-graduation-cap text-danger me-2"></i> Qualifications & Experience</strong>' +
                    formatList(item.qualifications) +
                    '</div>' +
                    '<div class="mb-0">' +
                    '<strong class="text-dark d-block mb-2" style="font-size:14px;"><i class="fa-solid fa-gears text-danger me-2"></i> Required Technical Skills</strong>' +
                    '<div>' + formatSkills(item.skills) + '</div>' +
                    '</div>' +
                    '</div>' +

                    '</div>' + /* Row End */
                    '</div>' + /* Box End */
                    '</div>' + /* Body End */
                    '</div>' + /* Collapse End */
                    '</div>'; /* Item End */
            }).join("");
        }

        function setupFilters() {
            var searchInput = document.getElementById("jdSearch");
            var deptFilter = document.getElementById("jdDeptFilter");

            if (deptFilter) {
                deptFilter.innerHTML = '<option value="all">All Departments</option>';
                var departments = Array.from(new Set(jobDescriptionsList.map(function (item) { return item.department; }).filter(Boolean))).sort();
                departments.forEach(function (d) {
                    var opt = document.createElement("option");
                    opt.value = d;
                    opt.textContent = d;
                    deptFilter.appendChild(opt);
                });
            }

            function applyFilters() {
                var q = (searchInput ? searchInput.value : "").trim().toLowerCase();
                var dept = deptFilter ? deptFilter.value : "all";

                var filtered = jobDescriptionsList.filter(function (item) {
                    var respText = Array.isArray(item.responsibilities) ? item.responsibilities.join(' ') : (item.responsibilities || '');
                    var skillText = Array.isArray(item.skills) ? item.skills.join(' ') : (item.skills || '');

                    var matchesQuery = (item.title || "").toLowerCase().includes(q) ||
                        respText.toLowerCase().includes(q) ||
                        skillText.toLowerCase().includes(q) ||
                        (item.reports_to || "").toLowerCase().includes(q);

                    var matchesDept = dept === "all" || item.department === dept;
                    return matchesQuery && matchesDept;
                });

                renderJdList(filtered);
            }

            if (searchInput) searchInput.addEventListener("input", applyFilters);
            if (deptFilter) deptFilter.addEventListener("change", applyFilters);
        }

        async function loadJdData() {
            if (window.supabaseClient) {
                try {
                    var res = await window.supabaseClient
                        .from("job_descriptions")
                        .select("*")
                        .order("title", { ascending: true });

                    if (res.data && res.data.length > 0) {
                        jobDescriptionsList = res.data;
                    }
                } catch (e) {
                    console.log("Using static job descriptions fallback.");
                }
            }
            renderJdList(jobDescriptionsList);
            setupFilters();
        }

        document.addEventListener("DOMContentLoaded", function () {
            renderJdList(jobDescriptionsList);
            setupFilters();
            loadJdData();
        });

        window.onIntranetReady = function () {
            loadJdData();
        };
    </script>
</body>

</html>
