<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="robots" content="noindex, nofollow">
   <title>Forgot Password | JACHINS Intranet</title>
   <link rel="shortcut icon" type="image/png" href="images/jachins_logo.png">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
   <link href="../css/custom.css" rel="stylesheet">
   <link href="intranet.css" rel="stylesheet">
</head>

<body>

   <div class="sis-login-section sis-primary-background">
      <div class="container"><div class="row"><div class="col-12">
         <div class="sis-login-card sisf-sis-comman-drop-bg sis-radius text-center">
            <a href="index.html" class="d-inline-block"><img src="images/jachins_logo.png" alt="JACHINS Development Limited" class="sis-login-logo"></a>
            <div class="sis-section-title mb-4">
               <span class="sisf-m-subtitle text-white">Employee Portal</span>
               <h2 class="sisf-m-title text-white" style="font-size: 24px;">Reset Your <span class="sisf-e-colored">Password</span></h2>
               <p class="mb-0" style="font-size:14px; color: rgba(255,255,255,0.65);">Enter your work email and we'll send you a link to reset your password.</p>
            </div>

            <div id="formMessage" class="sis-login-error" role="alert"></div>

            <form id="forgotForm">
               <div class="mb-4">
                  <label for="email" class="form-label">Work Email</label>
                  <input type="email" class="form-control" id="email" required placeholder="you@jachinsgroup.com">
               </div>
               <button type="submit" class="sis-btn-default" id="submitBtn" style="width:100%; justify-content:center; border:none;">
                  <span id="submitText">Send Reset Link</span>
                  <span id="submitSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
               </button>
            </form>

            <p class="mt-4 mb-0" style="font-size: 13px; color: rgba(255,255,255,0.5);">
               <a href="index.html" class="sisf-e-main-color"><i class="fa-solid fa-arrow-left pe-1"></i>Back to Login</a>
            </p>
         </div>
      </div></div></div>
   </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="supabase-config.js"></script>
   <script src="auth.js"></script>
   <script src="intranet.js"></script>
   <script>
      (function () {
         "use strict";
         var form = document.getElementById("forgotForm");
         var msgBox = document.getElementById("formMessage");
         var submitBtn = document.getElementById("submitBtn");
         var submitText = document.getElementById("submitText");
         var spinner = document.getElementById("submitSpinner");

         function showMessage(text, isError) {
            msgBox.textContent = text;
            msgBox.style.color = isError ? "#ffb3b3" : "#d1e7dd";
            msgBox.classList.add("is-visible");
         }

         form.addEventListener("submit", async function (e) {
            e.preventDefault();
            submitBtn.disabled = true;
            spinner.classList.remove("d-none");
            submitText.textContent = "Sending...";

            var email = document.getElementById("email").value.trim();

            // redirectTo must be an allowed Redirect URL in your Supabase
            // project (Auth -> URL Configuration) or Supabase will reject it.
            var { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
               redirectTo: window.location.origin + window.location.pathname.replace("forgot-password.html", "reset-password.html"),
            });

            submitBtn.disabled = false;
            spinner.classList.add("d-none");
            submitText.textContent = "Send Reset Link";

            // Same message whether or not the email exists — Supabase's API
            // itself doesn't reveal that, and we don't add detail on top.
            showMessage("If that email is registered, a password reset link has been sent.", false);
            form.reset();
         });
      })();
   </script>
</body>

</html>
