<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="robots" content="noindex, nofollow">
   <title>Change Password | JACHINS Intranet</title>
   <link rel="shortcut icon" type="image/png" href="images/jachins_logo.png">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
   <link href="../css/custom.css" rel="stylesheet">
   <link href="intranet.css" rel="stylesheet">
</head>

<body class="sisf-comman-bg-light" data-protected="true" data-page="change-password">

   <div id="header-placeholder"></div>

   <div class="sis-intranet-body sis-comman-background">

      <div id="sidebar-placeholder"></div>

      <main class="sis-intranet-main">
         <div class="sisf-sis-section-title sis-section-title mb-4">
            <span class="sisf-m-subtitle white sis-m-subtitle-dark">Account</span>
            <h2 class="sisf-m-title" style="font-size: 28px;">Change <span class="sisf-e-colored">Password</span></h2>
            <p class="mb-0">Enter your current password to confirm it's you, then set a new one.</p>
         </div>

         <div class="sisf-sis-comman-drop-bg sis-radius p-4" style="max-width:480px;">
            <div id="formMessage" class="sis-login-error" role="alert"></div>

            <form id="changePasswordForm">
               <div class="mb-3">
                  <label class="form-label text-white" style="font-size:13px;">Current Password</label>
                  <input type="password" id="currentPassword" class="form-control" required autocomplete="current-password">
               </div>
               <div class="mb-3">
                  <label class="form-label text-white" style="font-size:13px;">New Password</label>
                  <input type="password" id="newPassword" class="form-control" required minlength="8" autocomplete="new-password">
               </div>
               <div class="mb-3">
                  <label class="form-label text-white" style="font-size:13px;">Confirm New Password</label>
                  <input type="password" id="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password">
               </div>
               <button type="submit" class="sis-btn-default" id="submitBtn" style="width:100%; justify-content:center; border:none;">
                  <span id="submitText">Update Password</span>
                  <span id="submitSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
               </button>
            </form>
         </div>
      </main>
   </div>

   <div id="footer-placeholder"></div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="supabase-config.js"></script>
   <script src="auth.js"></script>
   <script src="intranet.js"></script>
   <script>
      window.onIntranetReady = function () {
         var form = document.getElementById("changePasswordForm");
         var msgBox = document.getElementById("formMessage");
         var submitBtn = document.getElementById("submitBtn");
         var submitText = document.getElementById("submitText");
         var spinner = document.getElementById("submitSpinner");

         function showMessage(text, isError) {
            msgBox.textContent = text;
            msgBox.style.color = isError ? "#ffb3b3" : "#d1e7dd";
            msgBox.classList.add("is-visible");
         }

         form.addEventListener("submit", async function (e) {
            e.preventDefault();
            var currentPassword = document.getElementById("currentPassword").value;
            var newPassword = document.getElementById("newPassword").value;
            var confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
               showMessage("New password and confirmation do not match.", true);
               return;
            }

            submitBtn.disabled = true;
            spinner.classList.remove("d-none");
            submitText.textContent = "Updating...";

            // Supabase has no direct "verify current password" call, so we
            // re-authenticate with it first — this is what actually proves
            // it's the account owner making the change, exactly like typing
            // your current password did in the PHP version.
            var session = await window.IntranetAuth.getSession();
            var email = session.user.email;

            var { error: verifyError } = await window.supabaseClient.auth.signInWithPassword({ email, password: currentPassword });
            if (verifyError) {
               showMessage("Current password is incorrect.", true);
               submitBtn.disabled = false;
               spinner.classList.add("d-none");
               submitText.textContent = "Update Password";
               return;
            }

            var { error: updateError } = await window.supabaseClient.auth.updateUser({ password: newPassword });
            submitBtn.disabled = false;
            spinner.classList.add("d-none");
            submitText.textContent = "Update Password";

            if (updateError) {
               showMessage(updateError.message || "Could not update password.", true);
               return;
            }

            showMessage("Password updated.", false);
            form.reset();
         });
      };
   </script>
</body>

</html>
