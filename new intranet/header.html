    header.html

<style>
   /* --- Permanent Fixed Header Styling --- */
   #sisf-page-header {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 1050 !important;
      background-color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
   }

   /* --- Balanced Top Spacing --- */
   body, 
   .sis-comman-background, 
   .sis-intranet-body {
      padding-top: 50px !important;
   }

   /* Avatar Image Container Styling */
   [data-user-avatar] {
      width: 36px !important;
      height: 36px !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      background-color: #d3a029 !important;
      color: #ffffff !important;
      font-weight: 600 !important;
   }

   [data-user-avatar] img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 50% !important;
   }
</style>

<!-- Dynamic Padding Adjuster -->
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>" style="display:none;" onload="(function(){
   window.addEventListener('DOMContentLoaded', function() {
      var header = document.getElementById('sisf-page-header');
      if (header) {
         var exactHeight = header.offsetHeight;
         if (exactHeight > 0) {
            document.body.style.setProperty('padding-top', (exactHeight + 10) + 'px', 'important');
         }
      }
   });
})()">

<header id="sisf-page-header" class="sisf-main-header sisf-standerd-header">
   <div id="sisf-page-header-inner" class="sisf-skin--dark position-relative d-flex align-items-center py-2 px-3">
      <div class="container-fluid px-2">
         <div class="d-flex align-items-center w-100">
            
            <!-- Sidebar Toggle Button -->
            <button class="sis-sidebar-toggle me-3 border-0 bg-transparent text-dark" data-sidebar-toggle type="button" aria-label="Toggle menu">
               <i class="fa-solid fa-bars fs-5"></i>
            </button>

            <!-- Brand Logo -->
            <a class="navbar-brand sisf-header-logo-link d-flex align-items-center me-3" href="dashboard.html">
               <img src="../images/jachins_logo.png" onerror="this.onerror=null;this.src='images/jachins_logo.png'" alt="JACHINS Logo" style="max-height: 50px;">
            </a>

            <!-- Employee Intranet Text -->
            <span class="fw-bold text-uppercase d-none d-sm-inline-block" style="font-size: 13px; color: #000; letter-spacing: 1.5px;">
               EMPLOYEE INTRANET
            </span>

            <!-- Right User Dropdown & Global Clock Widget Holder -->
            <div class="sisf-widget-holder ms-auto d-flex align-items-center gap-3">
               
               <!-- Real-Time Date & Clock Badge -->
               <div id="header-clock-badge" class="d-none d-md-flex align-items-center gap-2 bg-dark px-3 py-1 rounded-pill shadow-sm font-monospace" style="font-size: 13px;">
                  <i class="fa-regular fa-calendar-days text-warning"></i>
                  <span id="header-date-text" class="text-white">---, -- --- ----</span>
                  <span class="text-secondary">|</span>
                  <i class="fa-regular fa-clock text-warning"></i>
                  <span id="header-clock-text" class="text-white">--:--:-- --</span>
               </div>

               <!-- WORKING CLOCK TRIGGER -->
               <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>" style="display:none;" onload="(function(){
                  function runHeaderClock() {
                     var now = new Date();
                     var dateEl = document.getElementById('header-date-text');
                     var clockEl = document.getElementById('header-clock-text');

                     if (dateEl) {
                        dateEl.textContent = now.toLocaleDateString('en-US', {
                           weekday: 'short', year: 'numeric', month: 'short', day: '2-digit'
                        });
                     }
                     if (clockEl) {
                        clockEl.textContent = now.toLocaleTimeString('en-US', {
                           hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                        });
                     }
                  }
                  runHeaderClock();
                  if (!window.independentHeaderInterval) {
                     window.independentHeaderInterval = setInterval(runHeaderClock, 1000);
                  }
               })()">

               <!-- User Profile Dropdown -->
               <div class="dropdown">
                  <button class="btn d-flex align-items-center gap-2 text-dark border-0 bg-transparent p-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                     <span class="sis-avatar-sm" data-user-avatar>--</span>
                     <span class="d-none d-md-inline fw-semibold text-dark ms-1" data-user-name>Loading&hellip;</span>
                     <i class="fa-solid fa-chevron-down text-dark ms-1" style="font-size: 11px;"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2">
                     <li><a class="dropdown-item" href="employees.html"><i class="fa-regular fa-user me-2"></i>My Profile</a></li>
                     <li>
                       <a class="dropdown-item" href="#" onclick="openHeaderAvatarModal(event)"><i class="fa-solid fa-camera me-2 text-danger"></i>Change Photo</a>
                     </li>
                     <li><a class="dropdown-item" href="change-password.html"><i class="fa-solid fa-key me-2"></i>Change Password</a></li>
                     <li><a class="dropdown-item" href="hr.html"><i class="fa-solid fa-user-tie me-2"></i>HR Resources</a></li>
                     <li><hr class="dropdown-divider"></li>
                     <li><button type="button" class="dropdown-item text-danger" data-logout><i class="fa-solid fa-right-from-bracket me-2"></i>Log Out</button></li>
                  </ul>
               </div>
            </div>

         </div>
      </div>
   </div>
</header>

<!-- PROFILE PHOTO UPLOAD MODAL -->
<div class="modal fade" id="headerAvatarModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow" style="border-radius: 16px;">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold">Update Profile Picture</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center pt-3">
        <div class="mx-auto mb-3 rounded-circle text-white d-grid place-items-center fw-bold shadow-sm" id="headerModalPreview" style="width: 80px; height: 80px; background: #a30e2d; font-size: 28px; overflow: hidden;">
          <span id="headerModalPreviewInitial">U</span>
        </div>

        <div class="d-grid gap-2">
          <label class="btn btn-sm btn-danger fw-bold py-2" style="cursor: pointer;">
            <i class="fa-solid fa-upload me-1"></i> Upload New Photo
            <input type="file" id="headerAvatarFileInput" accept="image/*" style="display: none;">
          </label>
          <button class="btn btn-sm btn-outline-secondary py-2" id="removePhotoBtn">
            <i class="fa-solid fa-trash-can me-1"></i> Remove Photo
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADVANCED DEBUGGING & AVATAR SYNC SCRIPT -->
<script>
(function() {
  async function updateHeaderProfileInfo() {
    var client = window.supabaseClient || window.supabase;
    if (!client) {
      setTimeout(updateHeaderProfileInfo, 300);
      return;
    }

    try {
      var authRes = await client.auth.getUser();
      var user = authRes.data ? authRes.data.user : null;
      if (!user) return;

      var empRes = await client.from('employees').select('*').eq('auth_user_id', user.id).maybeSingle();
      var emp = empRes.data;

      var name = (emp && (emp.full_name || emp.name)) || (user.email ? user.email.split('@')[0] : 'User');
      
      // Check multiple common column name possibilities for avatar
      var avatarUrl = emp ? (emp.avatar_url || emp.photo_url || emp.image_url) : null;

      var nameEls = document.querySelectorAll('[data-user-name]');
      var avatarEls = document.querySelectorAll('[data-user-avatar]');

      nameEls.forEach(function(el) {
        el.textContent = name;
      });

      avatarEls.forEach(function(el) {
        if (avatarUrl && avatarUrl.trim() !== '') {
          el.innerHTML = '<img src="' + avatarUrl + '" alt="Avatar" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">';
        } else {
          el.innerHTML = '';
          el.textContent = name.charAt(0).toUpperCase();
        }
      });
    } catch (err) {
      console.error("Header profile sync error:", err);
    }
  }

  // Global handler for clicking "Change Photo"
  window.openHeaderAvatarModal = async function(e) {
    if (e) e.preventDefault();

    var modalEl = document.getElementById('headerAvatarModal');
    if (!modalEl) return;

    var modalInstance = null;
    if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
      modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
      modalInstance.show();
    } else {
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
    }

    var client = window.supabaseClient || window.supabase;
    if (!client) return;

    try {
      var authRes = await client.auth.getUser();
      var user = authRes.data ? authRes.data.user : null;
      if (!user) return;

      var empRes = await client.from('employees').select('*').eq('auth_user_id', user.id).maybeSingle();
      var emp = empRes.data;
      var avatarUrl = emp ? (emp.avatar_url || emp.photo_url || emp.image_url) : null;
      var name = (emp && (emp.full_name || emp.name)) || 'U';

      var preview = document.getElementById('headerModalPreview');
      if (preview) {
        if (avatarUrl && avatarUrl.trim() !== '') {
          preview.innerHTML = '<img src="' + avatarUrl + '" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">';
        } else {
          preview.innerHTML = name.charAt(0).toUpperCase();
        }
      }

      var fileInput = document.getElementById('headerAvatarFileInput');
      if (fileInput) {
        fileInput.onchange = async function(ev) {
          var file = ev.target.files[0];
          if (!file) return;

          try {
            var filePath = 'avatar_' + user.id + '_' + Date.now() + '.png';
            var upRes = await client.storage.from('avatars').upload(filePath, file);
            if (upRes.error) throw upRes.error;

            var pubData = client.storage.from('avatars').getPublicUrl(filePath);
            var publicUrl = pubData.data.publicUrl;

            await client.from('employees').update({ avatar_url: publicUrl }).eq('auth_user_id', user.id);
            if (modalInstance) modalInstance.hide();
            location.reload();
          } catch (err) {
            alert('Upload failed. Ensure the "avatars" storage bucket exists in Supabase.');
          }
        };
      }

      var removeBtn = document.getElementById('removePhotoBtn');
      if (removeBtn) {
        removeBtn.onclick = async function(event) {
          if (event) event.preventDefault();
          removeBtn.disabled = true;
          try {
            var updateRes = await client.from('employees')
              .update({ avatar_url: null, photo_url: null, image_url: null })
              .eq('auth_user_id', user.id)
              .select('id')
              .maybeSingle();
            if (updateRes.error) throw updateRes.error;
            if (!updateRes.data) throw new Error('No employee profile was updated.');

            var initials = name.trim().split(/\s+/).map(function(part) {
              return part.charAt(0);
            }).join('').slice(0, 2).toUpperCase() || '?';
            document.querySelectorAll('[data-user-avatar]').forEach(function(el) {
              el.textContent = initials;
            });
            var preview = document.getElementById('headerModalPreview');
            if (preview) preview.textContent = initials;
            if (modalInstance) modalInstance.hide();
          } catch (err) {
            console.error('Failed to remove profile photo:', err);
            alert('Failed to remove photo.');
          } finally {
            removeBtn.disabled = false;
          }
        };
      }
    } catch (err) {
      console.error("Modal open error:", err);
    }
  };

  window.refreshHeaderAvatar = updateHeaderProfileInfo;

  updateHeaderProfileInfo();
  setTimeout(updateHeaderProfileInfo, 500);
  setTimeout(updateHeaderProfileInfo, 1200);
})();
</script>
